name: Publish OBSIDIAN-6 v7.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed builds and tests
        run: npm test
      - name: Verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/obsidian-6-card.js
          test -s standalone/OBSIDIAN-6.html
          node -e 'const p = require("./package.json"); if (p.version !== "7.6.0") process.exit(1)'
      - name: Create release and upload the installable JS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v7.6.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its metadata unchanged."
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'obsidian-6-card.js'; then
              gh release upload "$TAG" dist/obsidian-6-card.js
            fi
          else
            gh release create "$TAG" dist/obsidian-6-card.js \
              --target "$GITHUB_SHA" \
              --title "OBSIDIAN-6 v7.6.0" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          gh release view "$TAG" --json url,tagName,assets \
            --jq '{url: .url, tag: .tagName, assets: [.assets[].name]}'
