name: Publish OBSIDIAN-6 release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish versioned release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed builds and tests
        run: npm test
      - name: Verify release files and calculate version
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/obsidian-6-card.js
          test -s standalone/OBSIDIAN-6.html
          VERSION="$(node -p 'require("./package.json").version')"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Publish GitHub release with installable JS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx obsidian-6-card.js; then
              gh release upload "$RELEASE_TAG" dist/obsidian-6-card.js
            fi
          else
            gh release create "$RELEASE_TAG" dist/obsidian-6-card.js \
              --target "$GITHUB_SHA" \
              --title "OBSIDIAN-6 $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          gh release view "$RELEASE_TAG" --json url,tagName,assets \
            --jq '{url: .url, tag: .tagName, assets: [.assets[].name]}'
